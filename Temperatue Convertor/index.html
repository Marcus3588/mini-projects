<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Temperature Convertor</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div id="container">
		<h2>Temperature Convertor</h2>
		<form id="tempForm">
			<label for="number">Temperature</label>
			<input type="number" id="temperature" placeholder="Enter temperature" required>
			<br><br>
			<label for="fromUnit">Convert from</label>
			<select id="fromUnit">
				<option value="Celsius">Celsius(&deg)</option>
				<option value="Fahrenheit">Fahrenheit(&deg)</option>
				<option value="Kelvin">Kelvin(&deg)</option>
			</select>
			<br><br>
			<label for="toUnit">Convert to</label>
			<select id="toUnit">
				<option value="Fahrenheit">Fahrenheit(&deg)</option>
				<option value="Celsius">Celsius(&deg)</option>
				<option value="Kelvin">Kelvin(&deg)</option>
			</select>
			<br><br>
			<button type="submit">Convert</button>
			<button type="button" id="resetBtn">Reset</button>
			<div id="result" class="result hidden">
				<p id="conversionResult"></p>
			</div>
		</form>
	</div>
	<script src="main.js"></script>
</body>
</html>
