<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Real-Time Character Counter</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="container">
		<h2>Real-Time Character Counter</h2>
		<label for="textInput">Type your or paste your text here</label>
		<textarea id="textInput" maxlength="150" placeholder="Start typing..."></textarea>

		<div class="counter-wrapper">
			<span id="charCount">0 / 150</span>
			<span id="warning-message" class="hidden">Maximum length</span>
		</div>
		</div>


</body>
<script src="main.js"></script>
</html>
