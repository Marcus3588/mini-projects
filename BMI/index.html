<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>BMI Calculator</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="container">
		<h2>BMI Calculator</h2>
		<form id="bmiForm">
			<label for="weight">weight</label>
			<input type="number" id="weight" placeholder="Enter weight" required>
			<select id="weightUnit">
				<option value="Weight" disabled selected>Select unit</option>
				<option value="kg">Kilograms</option>
				<option value="lbs">Pounds</option>
			</select>
			<br><br>

			<label for="height">height</label>
			<input type="number" id="height" placeholder="Enter height" required>
			<select id="heightUnit">
				<option value="Height" disabled selected>Select unit</option>
				<option value="cm">Centimeters</option>
				<option value="in">Inches</option>
			</select>

			<div class="button-group">
				<button type="submit">Calculate</button>
				<button type="button" id="resetBtn">Reset</button>
			</div>
		</form>
		<div id="result" class="result hidden">
			<p>Your BMI is: <span id="bmiValue">0.00</span></p>
			<p>Status : <span id="bmiStatus"></span></p>
		</div>


	</div>
	

	<script src="main.js"></script>
</body>
</html>
